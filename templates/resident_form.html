{% extends "base.html" %}{% block title %}إضافة موظف{% endblock %}{% block content %}
<div class="page-head"><div><span class="eyebrow">RESIDENT</span><h1>إضافة موظف للسكن</h1><p>سجل بيانات الموظف واربطه بالوحدة.</p></div></div>
<div class="panel form-panel"><form method="post" enctype="multipart/form-data"><div class="row g-3"><div class="col-md-6"><label>اسم الموظف *</label><input class="form-control" name="resident_name" required></div><div class="col-md-3"><label>كود الموظف</label><input class="form-control" name="employee_code"></div><div class="col-md-3"><label>رقم البطاقة</label><input class="form-control" name="card_no"></div><div class="col-md-4"><label>الوظيفة</label><input class="form-control" name="job_title"></div><div class="col-md-4"><label>نوع التعيين</label><select class="form-select" name="employment_type"><option>معين</option><option>يومي</option><option>مؤقت</option><option>متعاقد</option></select></div><div class="col-md-4"><label>الوحدة *</label><select class="form-select" name="apartment_id" required><option value="">اختر الوحدة</option>{% for a in apts %}<option value="{{ a.id }}">{{ a.contract_no }} — {{ a.landlord or '' }}</option>{% endfor %}</select></div><div class="col-md-6"><label>تاريخ التسكين</label><input class="form-control" type="date" name="move_in_date"></div><div class="col-md-6"><label>المرفق</label><input class="form-control" type="file" name="attachment" accept=".pdf,.jpg,.jpeg,.png,.xlsx,.doc,.docx"></div></div><div class="form-actions"><a class="btn btn-light" href="{{ url_for('dashboard') }}">إلغاء</a><button class="btn btn-primary">تسجيل الموظف</button></div></form></div>{% endblock %}
