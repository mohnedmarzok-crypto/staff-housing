{% extends "base.html" %}{% block title %}الأعمدة المخصصة{% endblock %}{% block content %}
<div class="page-head"><div><span class="eyebrow">CUSTOM FIELDS</span><h1>الأعمدة المخصصة</h1><p>تحكم في الحقول التي تظهر عند إدخال الوحدات.</p></div></div>
<div class="panel"><form method="post"><div class="table-responsive"><table class="table align-middle"><thead><tr><th>تفعيل</th><th>اسم الحقل</th><th>المفتاح</th><th>النوع</th></tr></thead><tbody>{% for f in fields %}<tr><td><input class="form-check-input" type="checkbox" name="active_{{ f.id }}" {% if f.enabled %}checked{% endif %}></td><td><input class="form-control" name="label_{{ f.id }}" value="{{ f.label }}"></td><td><code>{{ f.key }}</code></td><td>{{ f.field_type }}</td></tr>{% endfor %}</tbody></table></div><hr><h5>إضافة حقل جديد</h5><div class="row g-2"><div class="col-md-6"><input class="form-control" name="new_label" placeholder="اسم الحقل"></div><div class="col-md-6"><input class="form-control" name="new_key" placeholder="مفتاح إنجليزي مثل contract_type"></div></div><div class="form-actions"><button class="btn btn-primary">حفظ التعديلات</button></div></form></div>{% endblock %}
